name: Gemini Model Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-models:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install google-genai
        run: python -m pip install google-genai

      - name: List models available to this API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          for model in client.models.list():
              print(model.name)
          PY
