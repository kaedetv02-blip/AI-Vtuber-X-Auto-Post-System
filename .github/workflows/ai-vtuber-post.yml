name: AI VTuber SNS Post

on:
  schedule:
    # 06:30 / 12:30 / 16:30 / 21:30 JST (GitHub Actions cron is UTC).
    - cron: "30 21 * * *"
    - cron: "30 3 * * *"
    - cron: "30 7 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      force_theme:
        description: "Theme to use for a manual run"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - lunch
          - fun
          - night
      target_character:
        description: "Account to post when run manually"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - char1
          - char2

permissions:
  contents: read

concurrency:
  group: ai-vtuber-sns-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Nano Banana Pro can briefly return capacity errors; leave room for the
    # retry policy instead of cancelling a valid queued post.
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate and post
        run: python main.py
        env:
          # A scheduled run is assigned its intended theme before Python starts.
          # This avoids rejecting a post when GitHub queues a cron run outside its
          # nominal JST time window. Manual runs retain the selected input value.
          FORCE_THEME: ${{ github.event.schedule == '30 21 * * *' && 'morning' || github.event.schedule == '30 3 * * *' && 'lunch' || github.event.schedule == '30 7 * * *' && 'fun' || github.event.schedule == '30 12 * * *' && 'night' || inputs.force_theme || 'auto' }}
          TARGET_CHARACTER: ${{ inputs.target_character }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_TEXT_MAX_ATTEMPTS: "4"
          IMAGE_GENERATION_MAX_ATTEMPTS: "4"
          GEMINI_RETRY_BASE_SECONDS: "6"
          CHAR1_X_API_KEY: ${{ secrets.CHAR1_X_API_KEY }}
          CHAR1_X_API_SECRET: ${{ secrets.CHAR1_X_API_SECRET }}
          CHAR1_X_ACCESS_TOKEN: ${{ secrets.CHAR1_X_ACCESS_TOKEN }}
          CHAR1_X_ACCESS_TOKEN_SECRET: ${{ secrets.CHAR1_X_ACCESS_TOKEN_SECRET }}
          CHAR2_X_API_KEY: ${{ secrets.CHAR2_X_API_KEY }}
          CHAR2_X_API_SECRET: ${{ secrets.CHAR2_X_API_SECRET }}
          CHAR2_X_ACCESS_TOKEN: ${{ secrets.CHAR2_X_ACCESS_TOKEN }}
          CHAR2_X_ACCESS_TOKEN_SECRET: ${{ secrets.CHAR2_X_ACCESS_TOKEN_SECRET }}
