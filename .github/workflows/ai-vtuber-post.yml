name: AI VTuber SNS Post

on:
  schedule:
    # GitHub Actions のcronはUTC。JSTの06:30、16:30、21:30に実行する。
    - cron: "30 21 * * *"
    - cron: "30 7 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      force_theme:
        description: "手動実行時だけ時間帯を上書きします（auto は通常の時間帯判定）"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - おはようポスト
          - ネタポスト（面白・日常）
          - おやすみポスト

permissions:
  contents: read

concurrency:
  group: ai-vtuber-sns-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate and post
        run: python main.py
        env:
          FORCE_THEME: ${{ inputs.force_theme }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHAR1_X_API_KEY: ${{ secrets.CHAR1_X_API_KEY }}
          CHAR1_X_API_SECRET: ${{ secrets.CHAR1_X_API_SECRET }}
          CHAR1_X_ACCESS_TOKEN: ${{ secrets.CHAR1_X_ACCESS_TOKEN }}
          CHAR1_X_ACCESS_TOKEN_SECRET: ${{ secrets.CHAR1_X_ACCESS_TOKEN_SECRET }}
          CHAR2_X_API_KEY: ${{ secrets.CHAR2_X_API_KEY }}
          CHAR2_X_API_SECRET: ${{ secrets.CHAR2_X_API_SECRET }}
          CHAR2_X_ACCESS_TOKEN: ${{ secrets.CHAR2_X_ACCESS_TOKEN }}
          CHAR2_X_ACCESS_TOKEN_SECRET: ${{ secrets.CHAR2_X_ACCESS_TOKEN_SECRET }}
